name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The plugin declares engines >=20 and ships no dependencies, so every
        # supported line is cheap to prove at once.
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check every shipped module
        run: |
          node --check index.js
          node --check lib/plan.js
      - run: npm test

  pack:
    name: pack (what npm would publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # The published artifact is the contract, so the file list is asserted
      # rather than trusted: a stray file or a missing one fails here.
      - name: Inspect the tarball contents
        run: npm pack --dry-run --json > pack.json && node -e '
          const files = JSON.parse(require("fs").readFileSync("pack.json", "utf8"))[0].files
            .map((f) => f.path).sort();
          const required = ["LICENSE", "README.md", "cordis.patch.yml", "index.js", "lib/plan.js", "package.json"];
          const missing = required.filter((r) => !files.includes(r));
          const unwanted = files.filter((f) => f.startsWith("test/") || f.startsWith("verification/") || f.startsWith("probe"));
          if (missing.length || unwanted.length) {
            console.error("missing:", missing, "unwanted:", unwanted);
            process.exit(1);
          }
          console.log("tarball contents ok:", files.join(", "));
        '
