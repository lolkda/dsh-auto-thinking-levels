name: Release

# Tag a release and this workflow proves the tag matches package.json, runs the
# suite, packs the tarball it is about to ship, publishes to npm under the
# dist-tag that version deserves, and opens a GitHub Release. Nothing is ever
# published from a branch.
#
#   npm version patch && git push --follow-tags
#
# The dist-tag is derived from the version, not hardcoded:
#
#   version       dist-tag   `npm i <pkg>` gets it
#   0.1.1         latest     yes
#   0.1.1-rc.1    rc         no
#   0.1.1-beta.2  beta       no
#   0.1.1-next    next       no
#
# That derivation is load-bearing: npm refuses to publish a prerelease without
# an explicit --tag ("You must specify a tag using --tag when publishing a
# prerelease version"), which is why a version like 0.1.1-rc.1 cannot go out
# through a bare `npm publish`, and why `latest` can never be hijacked by an rc.
#
# The credential is npm trusted publishing: this job's OIDC identity is
# exchanged for a short-lived publish token, so there is no NPM_TOKEN secret.
# See "## 发布 / 凭据" in README.md for the one-time registration.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate and pack only — do not publish'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    permissions:
      # `contents: write` opens the GitHub Release.
      # `id-token: write` is the whole credential: npm exchanges this job's OIDC
      # token for a short-lived publish token, so there is no NPM_TOKEN secret
      # to store, rotate, leak or accidentally reuse.
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Prove the suite passes
        run: npm test

      - name: Prove the tarball is the one we mean to ship
        run: npm run check:pack

      - name: Resolve version, dist-tag and tarball name
        id: release
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"

          # On a tag push the tag must name the version being published.
          if [[ "$GITHUB_REF_TYPE" == "tag" && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

          if [[ "$version" == *-* ]]; then
            # 0.1.1-rc.1 -> rc | 1.0.0-beta.2 -> beta | 2.0.0-next -> next
            id="${version#*-}"
            id="${id%%.*}"
            case "$id" in
              alpha|beta|rc|next|canary|dev) tag="$id" ;;
              *)
                echo "::warning::unrecognised prerelease id '$id' — falling back to the 'next' dist-tag"
                tag=next
                ;;
            esac
            prerelease=true
          else
            tag=latest
            prerelease=false
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "shipping $version under the '$tag' dist-tag"

      - name: Prove npm trusts this workflow before spending a release on it
        run: |
          set -euo pipefail

          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "::error::this job cannot mint an OIDC token — it needs \`permissions: id-token: write\`"
            exit 1
          fi

          package="$(node -p 'require("./package.json").name')"

          # Mint a GitHub OIDC token for npm's audience and exchange it by hand.
          # npm does this itself inside `npm publish`, but when the trusted
          # publisher is not registered yet it fails as an opaque ENEEDAUTH;
          # doing it here first turns that into "register it, here is the link".
          id_token="$(curl -sSf \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" | jq -r .value)"

          status="$(curl -sS -o /tmp/oidc-exchange.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${id_token}" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${package}")"

          if [[ "$status" != "200" ]]; then
            # The body carries a token on success, so only ever print it on failure.
            echo "::error::npm refused the OIDC token exchange (HTTP $status)"
            echo "Register the trusted publisher at https://www.npmjs.com/package/${package}/access"
            echo "  Trusted Publisher -> GitHub Actions: owner lolkda, repository dsh-auto-thinking-levels, workflow publish.yml, environment blank"
            cat /tmp/oidc-exchange.json || true
            exit 1
          fi

          echo "npm accepted the OIDC token exchange for ${package}"

      - name: Publish
        env:
          TAG: ${{ steps.release.outputs.tag }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          set -euo pipefail
          # No stored npm token: npm mints a short-lived one from the job's OIDC
          # identity, and enables provenance for a public repo and package.
          args=(--provenance --access public --tag "$TAG")
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
            echo "::notice::dry run — the tarball is validated but nothing is published"
          fi
          npm publish "${args[@]}"

      - name: Prove the published version is actually on npm
        if: ${{ inputs.dry_run != true && github.event_name == 'push' }}
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          # Read it back from the registry rather than trusting the publish exit code.
          published="$(npm view "dsh-auto-thinking-levels@$TAG" version --registry=https://registry.npmjs.org)"
          if [[ "$published" != "$VERSION" ]]; then
            echo "::error::dist-tag $TAG points at $published, expected $VERSION"
            exit 1
          fi
          echo "dist-tag $TAG -> $published"

      - name: GitHub Release
        if: ${{ inputs.dry_run != true && startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(--title "$GITHUB_REF_NAME" --generate-notes --verify-tag)
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}"
